<style>
/* ── Itemize CTF Theme ── */
/* @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"); */
@import url("https://fonts.googleapis.com/css2?family=VT323&display=swap");

:root {
  --g1: #3cb34f;
  --g2: #2d8c40;
  --g3: #1a5c2a;
  --bg: #181b23;
  --surface: #1f2330;
  --card: #252a36;
  --border: rgba(255, 255, 255, 0.1);
  --border-green: rgba(60, 179, 79, 0.35);
  --text: #f0f2f8;
  --muted: rgba(240, 242, 248, 0.55);
}

/* ── Base ── */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  background-color: var(--bg) !important;
  /* Dot grid lives on the body itself so it scrolls with the page */
  background-image: radial-gradient(
    circle,
    rgba(255, 255, 255, 0.045) 1px,
    transparent 1px
  ) !important;
  background-size: 28px 28px !important;
  color: var(--text) !important;
  font-family: "VT323", monospace;
  /* font-family: */
  /*   Inter, */
  /*   -apple-system, */
  /*   BlinkMacSystemFont, */
  /*   "Segoe UI", */
  /*   sans-serif !important; */
  font-size: 15px;
  position: relative; /* anchor for #itemize-bg absolute positioning */
}

/* Disable CTFd's light/dark toggle — we own the colors */
[data-bs-theme] {
  --bs-body-bg: var(--bg) !important;
  --bs-body-color: var(--text) !important;
}

/* ── Navbar ── */

.navbar {
  background-color: var(--surface) !important;
  border-bottom: 1px solid var(--border) !important;
  font-weight: 400;
  backdrop-filter: blur(8px);
}
.navbar-brand {
  font-weight: 600 !important;
  font-size: 1.1rem !important;
  color: var(--text) !important;
  letter-spacing: -0.01em;

  font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace;
  /* font-family: "VT323", monospace; */
}
.navbar-brand::before {
  content: "> ";
  color: var(--g1);
  /* font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace; */
  font-weight: 300;
}
.navbar-brand::after {
  content: "_";
  color: var(--g1);
  /* font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace; */
  font-weight: 300;
  margin-left: 2px;
  animation: cursor-blink 1.1s step-end infinite;
}
@keyframes cursor-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}
.nav-link {
  color: rgba(240, 242, 248, 0.75) !important;
  font-size: 0.9rem;
  transition: color 0.15s;
}
.nav-link:hover {
  color: var(--text) !important;
}

/* ── Page hero / jumbotron ── */
.jumbotron {
  background: transparent !important;
  padding: 3rem 0 2rem !important;
  margin-bottom: 0 !important;
}
.jumbotron h1 {
  font-size: 2.2rem;
  font-weight: 300;
  letter-spacing: -0.02em;
  color: var(--text) !important;
}

/* ── Challenge grid ── */
.category-header {
  display: flex;
  align-items: baseline;
  gap: 0.5em;
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0.5rem !important;
}
.category-header::before {
  content: "//";
  color: var(--g1);
  font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace;
  font-size: 0.85rem;
  font-weight: 600;
  /* opacity: 0.8; */
  flex-shrink: 0;
  letter-spacing: -0.05em;
}
.category-header h3 {
  font-size: 1rem !important;
  font-weight: 500 !important;
  text-transform: uppercase !important;
  letter-spacing: 0.1em !important;
  color: var(--text) !important;
  margin: 0 !important;
  font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace !important;
  /* text-shadow: 0 0 18px rgba(60, 179, 79, 0.3); */
}

/* Challenge tile */
.challenge-button {
  background-color: var(--card) !important;
  border: 1px solid var(--border) !important;
  border-radius: 8px !important;
  color: var(--text) !important;
  text-align: left !important;
  padding: 1.1rem 1rem !important;
  transition:
    border-color 0.15s,
    box-shadow 0.15s,
    transform 0.12s !important;
  position: relative;
  overflow: hidden;
}
.challenge-button::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 8px;
  background: linear-gradient(
    135deg,
    rgba(60, 179, 79, 0.04) 0%,
    transparent 60%
  );
  opacity: 0;
  transition: opacity 0.15s;
}
.challenge-button:hover {
  border-color: var(--border-green) !important;
  box-shadow:
    0 0 0 1px var(--border-green),
    0 4px 20px rgba(60, 179, 79, 0.08) !important;
  transform: translateY(-1px) !important;
  background-color: var(--card) !important;
}
.challenge-button:hover::after {
  opacity: 1;
}

.challenge-button.challenge-solved {
  border: 2px solid var(--g1) !important;
  background-color: rgba(60, 179, 79, 0.07) !important;
  box-shadow: 0 0 10px rgba(60, 179, 79, 0.15) !important;
}
.challenge-button.challenge-solved::before {
  content: "✓";
  position: absolute;
  top: 0.5rem;
  right: 0.65rem;
  font-size: 0.7rem;
  color: var(--g1);
  font-weight: 600;
}

.challenge-inner {
  margin: 0 !important;
}
.challenge-inner p {
  font-size: 0.95rem !important;
  font-weight: 500 !important;
  margin: 0 0 0.4rem !important;
  color: var(--text) !important;
  line-height: 1.3;
}
.challenge-inner span {
  font-size: 0.78rem !important;
  font-weight: 600 !important;
  color: var(--g1) !important;
  letter-spacing: 0.02em;
}

/* ── Cards (scoreboard etc) ── */
.card {
  background-color: var(--card) !important;
  border: 1px solid var(--border) !important;
  border-radius: 8px !important;
  color: var(--text) !important;
}
.card-header {
  background-color: rgba(255, 255, 255, 0.03) !important;
  border-bottom: 1px solid var(--border) !important;
  font-weight: 500;
  font-size: 0.9rem;
  color: var(--text) !important;
}
.card-body {
  background-color: transparent !important;
}

/* ── Buttons ── */
.btn-primary,
.btn-success {
  background-color: var(--g1) !important;
  border-color: var(--g1) !important;
  color: #fff !important;
  font-weight: 500;
  border-radius: 6px !important;
  transition:
    background 0.15s,
    box-shadow 0.15s !important;
}

.btn-primary:hover,
.btn-success:hover {
  background-color: var(--g2) !important;
  border-color: var(--g2) !important;
  box-shadow: 0 0 12px rgba(60, 179, 79, 0.3) !important;
}
.btn-dark {
  background-color: var(--surface) !important;
  border-color: var(--border) !important;
  color: var(--text) !important;
}
.btn-dark:hover {
  background-color: var(--card) !important;
  border-color: rgba(255, 255, 255, 0.15) !important;
}
.btn-outline-primary {
  color: var(--g1) !important;
  border-color: var(--g1) !important;
}
.btn-outline-primary:hover {
  background-color: var(--g1) !important;
  color: #fff !important;
}
.btn-close {
  filter: invert(1) brightness(0.7);
}

.btn-file a {
  color: #fff !important;
}

/* ── Forms ── */
.form-control,
.form-select,
.input-group-text {
  background-color: rgba(255, 255, 255, 0.05) !important;
  border-color: var(--border) !important;
  color: var(--text) !important;
  border-radius: 6px !important;
  font-size: 0.9rem !important;
}
.form-control:focus,
.form-select:focus {
  border-color: rgba(60, 179, 79, 0.5) !important;
  box-shadow: 0 0 0 3px rgba(60, 179, 79, 0.12) !important;
  background-color: rgba(255, 255, 255, 0.06) !important;
}
.form-control::placeholder {
  color: var(--muted) !important;
}
.form-label {
  color: rgba(240, 242, 248, 0.7) !important;
  font-size: 0.85rem !important;
  font-weight: 500 !important;
}

/* ── Modals ── */
.modal-content {
  background-color: var(--surface) !important;
  border: 1px solid var(--border) !important;
  border-radius: 10px !important;
  color: var(--text) !important;
}
.modal-header {
  border-bottom: 1px solid var(--border) !important;
  padding: 1.25rem 1.5rem !important;
}
.modal-title {
  font-weight: 500 !important;
  font-size: 1.1rem !important;
}
.modal-footer {
  border-top: 1px solid var(--border) !important;
}
.modal-body {
  font-size: 0.95rem !important;
  line-height: 1.6 !important;
}

/* Modal backdrop: less aggressive on a dark theme */
.modal-backdrop {
  background-color: #0d0f14 !important;
  opacity: 0 !important;
  transition: opacity 0.15s !important;
}
.modal-backdrop.show {
  opacity: 0.6 !important;
}

/* ── Tables ── */
.table {
  --bs-table-bg: transparent;
  --bs-table-color: var(--text);
  --bs-table-border-color: var(--border);
  font-size: 0.9rem !important;
}
.table thead th {
  font-size: 0.75rem !important;
  font-weight: 600 !important;
  text-transform: uppercase !important;
  letter-spacing: 0.08em !important;
  color: var(--muted) !important;
  border-color: var(--border) !important;
}
.table-striped > tbody > tr:nth-of-type(odd) > * {
  background-color: rgba(255, 255, 255, 0.02) !important;
}
.table-hover > tbody > tr:hover > * {
  background-color: rgba(255, 255, 255, 0.05) !important;
}
td,
th {
  border-color: var(--border) !important;
}

/* ── Badges ── */
.badge.bg-success,
.badge {
  background-color: var(--g1) !important;
}
.badge.bg-secondary {
  background-color: rgba(255, 255, 255, 0.1) !important;
  color: var(--muted) !important;
}

/* ── Alerts ── */
.alert-success {
  background-color: rgba(60, 179, 79, 0.1) !important;
  border-color: rgba(60, 179, 79, 0.3) !important;
  color: #7ecc8d !important;
}
.alert-danger {
  background-color: rgba(239, 68, 68, 0.1) !important;
  border-color: rgba(239, 68, 68, 0.3) !important;
  color: #fca5a5 !important;
}
.alert-info {
  background-color: rgba(59, 130, 246, 0.1) !important;
  border-color: rgba(59, 130, 246, 0.3) !important;
  color: #93c5fd !important;
}

/* ── Links ── */
a {
  color: var(--g1);
}
a:hover {
  color: #6ed47e;
}
a.nav-link,
a.navbar-brand,
.dropdown-item a {
  color: inherit !important;
}

/* ── Dropdowns ── */
.dropdown-menu {
  background-color: var(--surface) !important;
  border: 1px solid var(--border) !important;
  border-radius: 8px !important;
  padding: 0.3rem !important;
}
.dropdown-item {
  color: var(--text) !important;
  border-radius: 5px !important;
  font-size: 0.875rem !important;
}
.dropdown-item:hover {
  background-color: rgba(60, 179, 79, 0.1) !important;
  color: var(--g1) !important;
}

/* ── Progress ── */
.progress {
  background-color: rgba(255, 255, 255, 0.07) !important;
  border-radius: 99px !important;
  height: 6px !important;
}
.progress-bar {
  background-color: var(--g1) !important;
  border-radius: 99px !important;
}

/* ── Footer ── */
footer.footer {
  background-color: var(--surface) !important;
  border-top: 1px solid var(--border) !important;
}
footer a,
.text-muted,
.text-secondary {
  color: var(--muted) !important;
}
footer a:hover {
  color: var(--g1) !important;
}

/* ── Code / pre ── */
code,
pre {
  font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace !important;
  background-color: rgba(0, 0, 0, 0.3) !important;
  border: 1px solid rgba(255, 255, 255, 0.08) !important;
  border-radius: 4px !important;
  padding: 0.15em 0.45em !important;
  color: var(--g1) !important;
  font-size: 0.875em !important;
}

/* ── Scrollbar ── */
::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.12);
  border-radius: 99px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(60, 179, 79, 0.4);
}

/* ── Toast / notification ── */
.toast {
  background-color: var(--surface) !important;
  border: 1px solid var(--border) !important;
  border-radius: 8px !important;
  color: var(--text) !important;
}
.toast-header {
  background-color: rgba(60, 179, 79, 0.08) !important;
  color: var(--text) !important;
  border-bottom: 1px solid var(--border) !important;
  font-size: 0.85rem !important;
  font-weight: 500 !important;
}

/* ── Force dark — hide the light/dark toggle ── */
.theme-switch {
  display: none !important;
}
.navbar {
  z-index: 1030 !important;
}

#itemize-bg,
.category-header:before,
.navbar,
.alert,
.jumbotron {
  animation: textShadow 1.6s infinite;
}
/* ── */

/* ── Solve flash — triggered via JS when challenge-solved class is added ── */
@keyframes solve-flash {
  0% {
    box-shadow:
      0 0 0 0 rgba(60, 179, 79, 0.7),
      0 0 10px rgba(60, 179, 79, 0.15);
  }
  40% {
    box-shadow:
      0 0 0 10px rgba(60, 179, 79, 0),
      0 0 10px rgba(60, 179, 79, 0.15);
  }
  100% {
    box-shadow:
      0 0 0 0 rgba(60, 179, 79, 0),
      0 0 10px rgba(60, 179, 79, 0.15);
  }
}
.solve-flash {
  animation: solve-flash 0.7s ease-out forwards;
}

/* ── Brainfuck background overlay — absolute so it scrolls with the page ── */
#itemize-bg {
  position: absolute;
  top: 56px;
  left: 0;
  right: 0;
  height: 55vh;
  overflow: hidden;
  opacity: 0.2;
  pointer-events: none;
  font-size: clamp(9px, 1vw, 13px);
  line-height: 1.5;
  word-break: break-all;
  color: var(--g1);
  z-index: 0;
  font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace;
  mask-image: linear-gradient(
    to bottom,
    rgba(0, 0, 0, 0.8) 0%,
    black 30%,
    transparent 100%
  );
  -webkit-mask-image: linear-gradient(
    to bottom,
    rgba(0, 0, 0, 0.8) 0%,
    black 30%,
    transparent 100%
  );
  padding: 12px 16px;
  white-space: pre-wrap;
  user-select: none;

  /* dots  */

  /*   circle at 1px 1px, */

</style>
<script>
// Force dark mode before first paint — prevents flash
// Also clear eventSounds to avoid the AudioContext autoplay browser warning
(function () {
  document.documentElement.setAttribute('data-bs-theme', 'dark');
  try { localStorage.setItem('data-bs-theme', 'dark'); } catch (e) {}
  if (window.init) window.init.eventSounds = [];
})();

document.addEventListener('DOMContentLoaded', function () {

  // ── Brainfuck background ──────────────────────────────────────────────────
  var bgEl = document.createElement('div');
  bgEl.id = 'itemize-bg';
  document.body.insertBefore(bgEl, document.body.firstChild);

  var src = '++++++++[->++++++++<]>+++++++++.<++++++[->++++++<]>+++++++.<+++[->---<]>------.++++++++.----.<++++[->++++<]>+.<++++[->----<]>-----.<++++++++[->--------<]>-----.<++++++[->++++++<]>++++++++++.++++++.------.+++++++.<++++++++[->--------<]>--------.---. ';
  var buf = '', bi = 0;
  (function tick() {
    if (buf.length >= 3200) return;
    for (var k = 0; k < 2 + Math.floor(Math.random() * 2); k++) { buf += src[bi++ % src.length]; }
    bgEl.textContent = buf;
    setTimeout(tick, 18 + Math.pow(Math.random(), 2) * 55);
  })();

  // ── Glitch-reveal — port of GlitchEmail.svelte ───────────────────────────
  // Scrambles all characters, then locks them in left-to-right 35ms per char.
  var CHARS = '!@#$%^&*()_+-=[]{}|;:,.<>?/~`0123456789abcdef';
  function rnd() { return CHARS[Math.floor(Math.random() * CHARS.length)]; }

  function glitchReveal(el, text, startDelay) {
    el.textContent = text.split('').map(rnd).join('');
    var scramId = setInterval(function () { el.textContent = text.split('').map(rnd).join(''); }, 80);
    setTimeout(function () {
      clearInterval(scramId);
      var i = 0;
      var revId = setInterval(function () {
        el.textContent = text.split('').map(function (c, j) { return j < i ? c : rnd(); }).join('');
        if (++i > text.length) { clearInterval(revId); el.textContent = text; }
      }, 35);
    }, startDelay);
  }

  // Applied to category headers as Alpine.js renders them
  var applied = new WeakSet();
  var order = 0;

  function applyToCategories() {
    document.querySelectorAll('.category-header h3').forEach(function (el) {
      var t = el.textContent.trim();
      if (!t || applied.has(el)) return;
      applied.add(el);
      glitchReveal(el, t, 250 + (order++) * 180); // staggered cascade
    });
  }

  new MutationObserver(applyToCategories)
    .observe(document.body, { childList: true, subtree: true });

  // ── Solve animation ───────────────────────────────────────────────────────
  // CTFd uses its own internal fetch wrapper (not window.fetch), so we can't
  // intercept at the network level. Instead watch for .alert-success being
  // added inside the open modal — that's exactly what Alpine renders on correct.
  var lastSolve = 0;

  new MutationObserver(function () {
    var modal = document.querySelector('.modal.show .modal-content');
    if (!modal || !modal.querySelector('.alert-success')) return;
    var now = Date.now();
    if (now - lastSolve < 2000) return; // debounce: one burst per solve
    lastSolve = now;
    solveParticles();
  }).observe(document.body, {
    childList: true,
    subtree: true,
    attributes: true,
    attributeFilter: ['class'],
  });

  function solveParticles() {
    // Brief green screen flash
    var flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;inset:0;background:rgba(60,179,79,0.12);pointer-events:none;z-index:9996;transition:opacity 0.5s ease-out;';
    document.body.appendChild(flash);
    requestAnimationFrame(function () {
      flash.style.opacity = '0';
      setTimeout(function () { flash.remove(); }, 550);
    });

    // Canvas particle burst from center of viewport
    var canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9997;';
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d');

    var cx = canvas.width  / 2;
    var cy = canvas.height / 2;
    var palette = ['#3cb34f','#2d8c40','#6ed47e','#a8e6b4','#ffffff'];
    var particles = [];

    for (var i = 0; i < 90; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 4 + Math.random() * 10;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        w: 5 + Math.random() * 6,
        h: 3 + Math.random() * 5,
        rot: Math.random() * Math.PI * 2,
        rv: (Math.random() - 0.5) * 0.25,
        color: palette[Math.floor(Math.random() * palette.length)],
        alpha: 1,
      });
    }

    (function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var alive = false;
      particles.forEach(function (p) {
        p.x  += p.vx;
        p.y  += p.vy;
        p.vy += 0.3;   // gravity
        p.vx *= 0.99;  // slight drag
        p.rot += p.rv;
        p.alpha -= 0.016;
        if (p.alpha <= 0) return;
        alive = true;
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle   = p.color;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (alive) requestAnimationFrame(frame);
      else canvas.remove();
    })();
  }

});

</script>
