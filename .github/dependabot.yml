# Keeping the dependencies current is meant to be unattended. The whole point
# of the rewrite is a surface small enough that this stays quiet: a handful of
# Go modules, one base image and a few actions, against the previous stack's
# fourteen runtime and twenty-four development packages.
#
# Minor and patch updates are grouped into one pull request per ecosystem.
# That is what makes this survivable for a board that turns over annually —
# the repository's history is otherwise dominated by one-at-a-time
# "Bump X from A to B". Major versions still arrive on their own, so somebody
# actually reads them.
#
# Updates open against dev rather than main, so they land where the rest of the
# work does and reach main through the usual pull request. Dependabot reads this
# file from the default branch regardless, so target-branch has to be set here
# on main to take effect. Security updates are exempt and still arrive on main.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch
