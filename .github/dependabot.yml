# Keeping the dependencies current is meant to be unattended. The whole point
# of the rewrite is a surface small enough that this stays quiet: a handful of
# Go modules, one base image and a few actions, against the previous stack's
# fourteen runtime and twenty-four development packages.
#
# Minor and patch updates are grouped into one pull request per ecosystem.
# That is what makes this survivable for a board that turns over annually —
# the repository's history is otherwise dominated by one-at-a-time
# "Bump X from A to B". Major versions still arrive on their own, so somebody
# actually reads them.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch

  # The legacy Sapper app under old-website/ is reference-only and frozen; it
  # never runs in production (.dockerignore keeps it out of the image). Its
  # package-lock.json still feeds the dependency graph, though, so without
  # this block Dependabot would file security-update PRs against code nobody
  # ships. Zero PR limit stops version updates; the wildcard ignore stops
  # security updates as well. Its Dockerfile needs no entry — the docker
  # ecosystem above only scans /, and directory scanning is not recursive.
  - package-ecosystem: npm
    directory: /old-website
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
