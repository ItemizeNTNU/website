# Ressurssamlingen på /ressurser.
#
# `id` er ankeret i URL-en. Ikke endre eksisterende id-er — de kan være lenket
# til utenfra. Det gjelder også skrivefeilen "youtube-kalaer", som er bevart
# med vilje.
#
# Beskrivelser kan inneholde lenker med {etikett} i teksten og en tilsvarende
# oppføring under `refs`. Alt annet blir escapet, så det er ikke mulig å få
# HTML inn i siden herfra.

categories:
  - id: ctfer
    heading: "CTFer:"
    nav_label: CTFer
    links:
      - title: PicoCTF
        url: https://play.picoctf.org/practice
        paragraphs:
          - text: >
              PicoCTF sin practice gym er et fint sted å begynne med
              introduksjonsoppgaver for web, kryptografi, reverse enginering,
              forensics og linux kommandolinje.

      - title: Hacker 101
        url: https://ctf.hacker101.com
        paragraphs:
          - text: >
              CTF oppgaver laget av HackerOne. Har mange ulike oppgaver og fint
              introduksjonsnivå.

      - title: Cryptohack
        url: https://cryptohack.org
        paragraphs:
          - text: Mange ulike CTF oppgaver innen kryptografi.

      - title: Crackmes
        url: https://crackmes.one
        paragraphs:
          - text: >
              Crackmes er en samnling med reverse enginering oppgaver av ulike
              slag.

      - title: Hack The Box
        url: https://www.hackthebox.eu
        paragraphs:
          - text: >
              Hack The Box (HTB) har ulike virtuelle maskiner eller bokser hvor
              du gjør større deler av mer reell penetrasjonstesting. Alle
              boksene pleier å følge prosessen med å starte ved scanning, få
              kjørt kode som bruker, for så å eskalere opp til system/root
              bruker.
          - text: >
              Fordel med HTB over andre CTFer er at ting gjerne føles litt mer
              reelt. Oppgaver og bokser er gjerne litt mer omfatende enn kun én
              enkelt CTF oppgave, men mange av boksene kan løses med standard
              verktøy og går gjerne ikke fult så inn i detaljer som andre mer
              tradisjonelle CTF oppgaver.

      - title: Try Hack Me
        url: https://tryhackme.com
        paragraphs:
          - text: >
              Alternativ til Hack The Box. Har virtuelle maskiner hvor du gjør
              hele penetrasjonstesting prosessen med scanning, få bruker og
              eskaler til root/system.

  - id: youtube-kalaer # skrivefeil bevart med vilje — se toppen av filen
    heading: YouTube Kanaler
    nav_label: YouTube Kanaler
    links:
      - title: LiveOverflow
        url: https://www.youtube.com/channel/UClcE-kVhqyiHCcjYwcpfj9w
        paragraphs:
          - text: >
              LiveOverflow lager høykvalitets videoer hvor han presenterer
              temaer, sårbarheter og alt annen interesant innen infosec. Han går
              også gjennom CTF oppgaver og fokuserer mer på unike og lærerike
              oppgaver i stedet for kvantitet.

      - title: John Hammond
        url: https://www.youtube.com/c/JohnHammond010/
        paragraphs:
          - text: >
              Youtuber som går gjennom mye CTFer og TryHackMe bokser. Viser mye
              ulike verktøy og metoder.

      - title: IppSec
        url: https://www.youtube.com/c/ippsec/
        paragraphs:
          - text: >
              IppSec går gjennom alle Hack The Boks oppgaver som blir lagt ut
              etter de ikke lenger er "aktive". Han går også jennom andre
              verktøyer og metoder fra tid til annen. Han viser også hele
              prosessen med å gå gjennom boksen.
          - text: >
              Sjekk også ut {ippsec.rocks} hvor du kan søke gjennom alle
              videoene han har gått gjennom etter spesifikke verktøy eller
              metoder, kommer med timestamps til videoene.
            refs:
              ippsec.rocks: https://ippsec.rocks

  - id: verktøy
    heading: Verktøy
    nav_label: Verktøy
    links:
      - title: CyberChef
        url: https://gchq.github.io/CyberChef/
        paragraphs:
          - text: >
              CyberChef er et online verktøy med over 300 ulike moduler bygget
              inn. Har alt fra base64 til kryptering og fil gjenskjenning.
              CyberChef har også automatiske moduler samt tillater chaining med
              moduler etter hverandre. Mange CTF oppgaver kan ofte løses ene og
              alene i CyberChef.

      - title: Burp Suite
        url: https://portswigger.net/burp
        paragraphs:
          - text: >
              En web proxy for å logge, redigere og injekte forespørsler mellom
              deg og nettleseren din. Bra verktøy for å gjøre manuelle endringer
              til forespørsler eller gjenta forespørsler flere ganger.

      - title: Hashes
        url: https://hashes.com
        paragraphs:
          - text: >
              Online verktøy for å detektere hash type samt søke etter kjente
              hashes.
        # ⚠️  IKKE FJERN. Dette er en bit av et CTF-flagg, og hele poenget er at
        # den ligger i HTML-kilden uten å vises på siden. Den rendres som
        # <p id="flag-part" hidden>. Se også regelen for [hidden] i
        # assets/static/css/00-reset.css, som er det som holder den skjult.
        hidden_note: b9d6b360c532f30e9cf97a9e84e64479

      - title: ZXing Decoder
        url: https://zxing.org/w/decode.jspx
        paragraphs:
          - text: >
              Online implementasjon av XZing, et QRcode verktøy som støtter mange
              ulike 1D og 2D QRkode formater.

      - title: pwntools
        url: https://github.com/Gallopsled/pwntools
        paragraphs:
          - text: >
              Pwntools er et CTF toolkit skrevet i python for rask prototyping og
              tar seg av mye av "boilerplate" koden som man skriver hver gang.
              Pwntools har også en god del kule og nyttige funksjoner som en ofte
              bruker på CTFer, som generering av shellcode payloads eller enkel
              asynkron håndtering av sockets og prosesser.

      - title: Compiler Explorer
        url: https://godbolt.org/
        paragraphs:
          - text: >
              Online verktøy for å studere assembly bytecode. Støtter en rekke
              ulike kompilatorer i flere ulike språk. Fint for å sammenligne hva
              kode faktisk kompilerer til.

      - title: stego-toolkit
        url: https://github.com/DominicBreuker/stego-toolkit
        paragraphs:
          - text: >
              En samling steganography verktøy samlet i en enkel verktøykase.
              Finnes også et {docker image} du kan kjøre, så slipper du å
              installere alle verktøy selv.
            refs:
              docker image: https://hub.docker.com/r/dominicbreuker/stego-toolkit

      - title: StegOnline Checklist
        url: https://stegonline.georgeom.net/checklist
        paragraphs:
          - text: >
              En fin liste over ting man bør teste når man går gjennom
              steganography oppgaver.

      - title: requestbin
        url: https://requestbin.com
        paragraphs:
          - text: >
              Lar deg sette opp webhook endpoints for callbacks, fin måte å kunne
              hente ut informasjon hvis du ikke har en egen server tilgjengelig.

      - title: Cipher Identifier
        url: https://www.boxentriq.com/code-breaking/cipher-identifier
        paragraphs:
          - text: >
              Verktøy som kan hjelpe å identifisere hvilken type krypteringscipher
              som har blitt brukt.

      - title: awesome-ctf
        url: https://github.com/apsdehal/awesome-ctf
        paragraphs:
          - text: >
              En samling med ulike verktøy fordelt på kategorier. Inneholder de
              fleste verktøy det er å anbefale.

      - title: CTF Resources
        url: https://ctfs.github.io/resources/
        paragraphs:
          - text: >
              Et open source github wiki prosjekt som samller mange verktøy og
              teknologier.

  - id: misc-it
    heading: Misc. IT
    nav_label: Misc. IT
    links:
      # URL-en hadde tidligere "- " foran seg, så lenken var ødelagt. Rettet.
      - title: MIT missing lecture
        url: https://missing.csail.mit.edu/
        paragraphs:
          - text: >
              Praktisk forelesninger om operativ systemer med fokus på UNIX og
              div. nyttige konsepter og terminal-opplæring
          - text: "Konsepter: vim, git, ssh, bash"
